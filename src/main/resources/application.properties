spring.application.name=jobtracker
server.port=${PORT:8080}
server.error.include-message=always

# Online MongoDB Atlas URI
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://jobtracker_user:abcd123@cluster0.8q7mge3.mongodb.net/jobtracker?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://jobtracker_user:abcd123@cluster0.8q7mge3.mongodb.net/jobtracker?retryWrites=true&w=majority&appName=Cluster0}

jwt.secret=${JWT_SECRET:my-super-secret-key-for-job-tracker-application-123456}
jwt.expiration=86400000

# Email SMTP Configuration (Gmail or custom SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Timezone for scheduler comparisons (defaults to Asia/Kolkata for India)
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
